<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Account | ARS Store</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/auth.css">
  <script src="/auth.js" defer></script>
</head>
<body>
  <header class="site-header auth-header">
    <a class="brand" href="/"><span class="brand-mark">ARS</span><span class="brand-copy"><strong>ARS STORE</strong><small>Account</small></span></a>
    <a class="auth-back" href="/">স্টোরে ফিরে যান</a>
  </header>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="authTitle">
      <div class="auth-mark" aria-hidden="true">ARS</div>
      <p class="auth-eyebrow">ARS STORE ACCOUNT</p>
      <h1 id="authTitle">আপনার অ্যাকাউন্টে প্রবেশ করুন</h1>
      <p id="authIntro" class="auth-intro">ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করুন, অথবা নতুন অ্যাকাউন্ট তৈরি করুন।</p>

      <div id="authTabs" class="auth-tabs" role="tablist" aria-label="Login or register">
        <button class="auth-tab is-active" id="loginTab" type="button" role="tab" aria-selected="true">লগইন</button>
        <button class="auth-tab" id="registerTab" type="button" role="tab" aria-selected="false">নতুন অ্যাকাউন্ট</button>
      </div>

      <form id="authForm" novalidate>
        <div id="nameField" class="auth-field" hidden>
          <label for="name">আপনার নাম (ঐচ্ছিক)</label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="60" placeholder="আপনার নাম">
        </div>
        <div class="auth-field">
          <label for="email">ইমেইল ঠিকানা</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="name@example.com">
        </div>
        <div class="auth-field">
          <label id="passwordLabel" for="password">পাসওয়ার্ড</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required placeholder="কমপক্ষে ১০ অক্ষর">
          <p id="passwordHint" class="auth-hint">আপনার অ্যাকাউন্টের পাসওয়ার্ড দিন।</p>
        </div>
        <div id="confirmField" class="auth-field" hidden>
          <label for="confirmPassword">পাসওয়ার্ড আবার লিখুন</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="একই পাসওয়ার্ড আবার দিন">
        </div>
        <button id="submitButton" class="auth-submit" type="submit">লগইন করুন</button>
      </form>
      <div id="authLinks" class="auth-links">
        <button id="forgotLink" class="auth-link" type="button">পাসওয়ার্ড ভুলে গেছেন?</button>
      </div>
      <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
      <p class="auth-footnote">পাসওয়ার্ড ভুলে গেলে অ্যাডমিনের সঙ্গে যোগাযোগ করুন। পাসওয়ার্ড নিরাপদভাবে hash করে সংরক্ষণ করা হয়।</p>
    </section>
  </main>
</body>
</html>
